# ddcolord config for the BenQ PD3220U. See ddcolord.toml(5).
#
# The color mode is VCP 0xDC: SL holds the mode, SH the sub-mode (only Low
# Blue Light has one). Codes mapped by hand against the OSD, MCCS 2.2 firmware.
#
# The profiles are the generic CC0 ones shipped in ../icc/ (see its README for
# what each assumes). Relative paths resolve against this file's directory,
# so they work from a checkout and from <prefix>/share/ddcolord/examples/.
# A copy elsewhere needs absolute paths, ideally to profiles measured for the
# monitor itself.

interval = 3

[[monitor]]
vendor = "BNQ"
model = "BenQ PD3220U"
# Modes with no icc of their own (and codes not listed) get this profile.
# Remove the line to leave the previous profile in place instead.
unmapped = "../icc/sRGB-v4.icc"

[[monitor.mode]]
code = 0x0a
name = "sRGB"
icc = "../icc/sRGB-v4.icc"

[[monitor.mode]]
code = 0x0c
name = "Rec.709"
# Rec. 709 camera curve; the monitor's mode is likely BT.1886 (gamma 2.4).
icc = "../icc/Rec709-v4.icc"

[[monitor.mode]]
code = 0x25
name = "Adobe RGB"
icc = "../icc/AdobeCompat-v4.icc"

[[monitor.mode]]
code = 0x22
name = "Display P3"
icc = "../icc/DisplayP3-v4.icc"

[[monitor.mode]]
code = 0x21
name = "DCI-P3"
# Theatrical DCI-P3 (DCI white, gamma 2.6); not verified against this mode.
icc = "../icc/DCI-P3-v4.icc"

[[monitor.mode]]
code = 0x0f
name = "M-book"

[[monitor.mode]]
code = 0x10
name = "CAD/CAM"

[[monitor.mode]]
code = 0x12
name = "User"

[[monitor.mode]]
code = 0x13
sub = 0x01
name = "Low Blue Light: Multimedia"

[[monitor.mode]]
code = 0x13
sub = 0x02
name = "Low Blue Light: Web Surfing"

[[monitor.mode]]
code = 0x13
sub = 0x03
name = "Low Blue Light: Office"

[[monitor.mode]]
code = 0x13
sub = 0x04
name = "Low Blue Light: Reading"

[[monitor.mode]]
code = 0x14
name = "Animation"

[[monitor.mode]]
code = 0x20
name = "Darkroom"

[[monitor.mode]]
code = 0x23
name = "HDR"

[[monitor.mode]]
code = 0x24
name = "DICOM"
